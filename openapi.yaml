  /posts/feed:
    get:
      tags:
        - Posts
      summary: Get the personalised feed
      description: |
        Returns the posts of the users the authenticated user follows **plus** the
        authenticated user's own posts, newest first. Authentication is **required**.

        The list is paginated with the `limit` / `cursor` pair.
      operationId: getFollowedUsersPosts
