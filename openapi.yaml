        data:
          type: object
          required:
            - message
            - unfollowedUser
          properties:
            message:
              type: string
              example: User unfollowed successfully.
            unfollowedUser:
              $ref: '#/components/schemas/ObjectId'
      example:
        status: success
        data:
          message: User unfollowed successfully.
          unfollowedUser: 6ad63ae4f5663c55f5529c0d

    UserIsFollowingResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          enum:
            - success
          example: success
        data:
          type: object
          required:
            - message
            - isFollowing
          properties:
            message:
              type: string
              example: Successfully checked if user is following another user.
            isFollowing:
              type: boolean
              description: Whether the authenticated caller follows the requested user.
              example: true
      example:
        status: success
        data:
          message: Successfully checked if user is following another user.
          isFollowing: true

    # ------------------------------------------------------------------
    # Post schemas
    # ------------------------------------------------------------------
    Post:
      type: object
      description: |
        A post as returned by the list endpoints (`GET /posts`, `GET /posts/my-posts`,
        `GET /posts/feed`, `GET /posts/user/{id}`).

        The author is populated with its id and nickname, and `postComments` holds the
        **ids** of the comments — the comments themselves are not embedded in list
        responses.
      required:
        - _id
        - createdBy
        - postContent
        - postComments
        - createdAt
        - updatedAt
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        createdBy:
          $ref: '#/components/schemas/PopulatedUser'
        postContent:
          type: string
          minLength: 1
          maxLength: 140
          example: Just built an amazing API with Node.js and Express!
        postComments:
          type: array
          description: Ids of the comments attached to this post.
          items:
            $ref: '#/components/schemas/ObjectId'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-19T15:44:36.554Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-19T15:44:36.554Z'
        __v:
