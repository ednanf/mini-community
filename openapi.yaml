  /posts/{id}:
    get:
      tags:
        - Posts
      summary: Get a single post with its comments
      description: |
        Returns one post together with its comments. **No authentication is required.**

        The author is populated with `nickname` only, and every comment is populated with
        its content and its author's `nickname`. The populated comments therefore contain
        only `_id`, `commentContent` and `createdBy` — they do **not** carry
        `parentPost`, `createdAt` or `updatedAt`.
      operationId: getPostById
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: Post retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostGetByIdResponse'
              example:
                status: success
                data:
                  message: Post retrieved successfully
                  postContent:
                    _id: 6ad63ae4f5663c55f5529b55
                    createdBy:
                      _id: 6ad63ae4f5663c55f5529b4b
                      nickname: johndoe
                    postContent: Just built an amazing API with Node.js and Express!
                    postComments:
                      - _id: 6ad63ae4f5663c55f5529b9c
                        createdBy:
                          _id: 6ad63ae4f5663c55f5529c0d
                          nickname: janedoe
                        commentContent: Great post! Thanks for sharing.
                    createdAt: '2026-10-19T15:44:36.554Z'
                    updatedAt: '2026-10-19T15:44:43.513Z'
                    __v: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Posts
      summary: Delete a post
      description: |
        Deletes a post. **Only the author of the post can delete it** — the delete is
        executed with the `{ _id, createdBy }` pair, so a request for somebody else's
        post matches nothing and answers `404 Post not found or you do not have
        permission to delete it.`

        Authentication is **required**.
      operationId: deletePost
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: Post deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDeleteResponse'
              example:
                status: success
                data:
                  message: Post deleted successfully
                  deletedPostId: 6ad63ae4f5663c55f5529b55
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: |
            The post does not exist, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                data:
                  message: Post not found or you do not have permission to delete it.
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================================================
  # COMMENTS (nested under a post)
  # ==========================================================================
  /posts/{postId}/comments:
    get:
      tags:
        - Comments
      summary: List the comments of a post
      description: |
        Returns the comments of a post, newest first. **No authentication is required.**

        The list is paginated with the `limit` / `cursor` pair. Each comment carries the
        populated author (`_id` + `nickname`), the raw `parentPost` ObjectId, the
        timestamps and the Mongoose version key `__v`.
      operationId: getComments
      parameters:
        - $ref: '#/components/parameters/PostIdPathParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Comments retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentsListResponse'
              example:
                status: success
                data:
                  message: Comments retrieved successfully
                  comments:
                    - _id: 6ad63aeb6b20a9f776d24c11
                      createdBy:
                        _id: 6ad63aeb6b20a9f776d24c0b
                        nickname: janedoe
                      parentPost: 6ad63aeb6b20a9f776d24c0d
                      commentContent: Great post! Thanks for sharing.
                      createdAt: '2026-10-19T15:44:43.512Z'
                      updatedAt: '2026-10-19T15:44:43.512Z'
                      __v: 0
                  nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Comments
      summary: Comment on a post
      description: |
        Creates a comment on the given post. Authentication is **required**.

        **Validation** — `commentContent` is required, must not be empty and must be at
        most 140 characters long. The body is XSS-sanitised and unknown properties are
        stripped before validation.

        After the comment is stored, its id is pushed onto the `postComments` array of the
        parent post, so the post immediately reflects the new comment.

        The response contains the created comment with `createdBy` and `parentPost` as raw
        ObjectId strings (they are not populated with the author profile).
      operationId: createComment
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
            example:
              commentContent: Great post! Thanks for sharing.
      responses:
        '201':
          description: Comment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentCreateResponse'
              example:
                status: success
                data:
                  message: Comment created successfully
                  commentContent:
                    createdBy: 6ad63aeb6b20a9f776d24c0b
                    parentPost: 6ad63aeb6b20a9f776d24c0d
                    commentContent: Great post! Thanks for sharing.
                    _id: 6ad63aeb6b20a9f776d24c11
                    createdAt: '2026-10-19T15:44:43.512Z'
                    updatedAt: '2026-10-19T15:44:43.512Z'
                    __v: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/{postId}/comments/{id}:
    delete:
      tags:
        - Comments
      summary: Delete a comment
      description: |
        Deletes a comment. **Only the author of the comment can delete it** — the delete
        is executed with the `{ _id, createdBy }` pair, so a request for somebody else's
        comment matches nothing and answers `404`.

        Authentication is **required**.
      operationId: deleteComment
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdPathParam'
        - $ref: '#/components/parameters/CommentIdPath'
