  /posts/user/{id}:
    get:
      tags:
        - Posts
      summary: Get the posts of a specific user
      description: |
        Returns every post written by the user identified by `id`, newest first.
        **No authentication is required.**

        The list is paginated with the `limit` / `cursor` pair. The `id` path parameter
        is validated as a MongoDB ObjectId, so a malformed value returns `400`.
      operationId: getPostsByUserId
