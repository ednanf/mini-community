openapi: 3.0.3

info:
  title: Mini Community API
  version: 1.0.0
  description: |
    REST API for **Mini Community**, a small social-networking application built with
    Node.js, Express 5, TypeScript, Mongoose (MongoDB) and Zod.

    The API exposes four resource groups, all mounted under the `/api/v1` prefix:

    | Group      | Base path                | Router                    |
    | ---------- | ------------------------ | ------------------------- |
    | Auth       | `/api/v1/auth`           | `authRoutes.ts`           |
    | Users      | `/api/v1/users`          | `usersRoutes.ts`          |
    | Posts      | `/api/v1/posts`          | `postsRoutes.ts`          |
    | Comments   | `/api/v1/posts/{postId}/comments` | `commentsRoutes.ts` (nested) |

    The comments router is **also** mounted a second time at `/api/v1/comments` (legacy
    top-level mount). Those duplicate routes are documented in the
    *Comments (Top-Level Mount)* tag.

    ---

    ## Response envelope

    Every response — with the single exception of the rate-limit error (see below) — uses
    the same envelope:

    ```json
    {
      "status": "success",
      "data": { }
    }
    ```

    On failure, `status` is the string `"error"` and `data` carries the details:

    ```json
    {
      "status": "error",
      "data": { "message": "Human readable explanation" }
    }
    ```

    Unhandled server errors additionally include a `data.errorId` (UUID) that matches the
    identifier written to the server log, so a report can be correlated with the logs.

    ### Rate-limit error is a different shape

    The rate limiter is configured with a plain object message, so the `429` response does
    **not** follow the envelope above:

    ```json
    { "status": 429, "error": "Too many requests, please try again later." }
    ```

    ---

    ## Authentication

    Authentication is stateless JWT (HS256). Call `POST /api/v1/auth/register` or
    `POST /api/v1/auth/login` to obtain a token, then send it on every protected request:

    ```http
    Authorization: Bearer <token>
    ```

    The token payload contains only the user id:

    ```json
    { "userId": "6ad63ae4f5663c55f5529b4b", "iat": 1792424641, "exp": 1795016641 }
    ```

    Token lifetime is controlled by the `JWT_LIFETIME` environment variable (a `ms`
    style string such as `30d`, `1h`, `15m`) and defaults to `30d` in the shipped
    configuration. Because the token is stateless, `POST /api/v1/auth/logout` cannot
    invalidate it server-side — the client must simply discard the token.

    Endpoints marked as *optional auth* accept the header but never require it. A missing
    or malformed header is simply ignored, and the request proceeds as anonymous. A
    **present but invalid** token is also ignored on those endpoints.

    ---

    ## Cursor pagination

    All list endpoints (`GET /posts`, `GET /posts/my-posts`, `GET /posts/feed`,
    `GET /posts/user/{id}`, `GET /posts/{postId}/comments`, `GET /comments`) are paginated
    with an opaque cursor:

    * `limit` — number of items per page. Defaults to `20` when omitted. The value is
      parsed with `parseInt`, so a non-numeric value, `0` or a negative number silently
      falls back to `20`. **No upper bound is enforced by the server.**
    * `cursor` — the `_id` of the last item of the previous page (24-character hex
      ObjectId). The item identified by the cursor is *excluded* from the next page;
      only strictly older items (`_id < cursor`) are returned.

    The response always contains `nextCursor`:

    * `nextCursor` is a **string** when more pages exist — pass it back as `cursor`.
    * `nextCursor` is **`null`** when the last page has been reached.

    Results are always sorted by `_id` descending (newest first).

    ---

    ## Rate limiting

    A per-IP limiter allows **300 requests per 15-minute window** (in-memory store).
    When the quota is exhausted the API answers `429` with the
    `Retry-After` header. Every response carries the current quota state:

    | Header                    | Meaning                                  |
    | ------------------------- | ---------------------------------------- |
    | `X-RateLimit-Limit`       | Requests allowed in the current window   |
    | `X-RateLimit-Remaining`   | Requests still available in this window  |
    | `X-RateLimit-Reset`       | Unix timestamp (seconds) when the window resets |
    | `Retry-After`             | Seconds to wait (only sent with `429`)   |

    ---

    ## Request validation and sanitisation

    * **ObjectIds** — every path parameter that carries a MongoDB id is validated with
      `mongoose.Types.ObjectId.isValid` before the controller runs. A malformed id yields
      `400` with `Invalid <param> format`. The only exceptions are the `/users` routes,
      which are **not** protected by that middleware — sending a malformed id there
      produces a `500` (Mongoose `CastError`) instead of a `400`.
    * **Bodies** — request bodies are validated with Zod and the parsed result *replaces*
      the raw body, so any property that is not part of the schema is silently dropped.
    * **XSS** — `POST /auth/register`, `POST /auth/login`, `POST /posts`,
      `POST /posts/{postId}/comments` and `PATCH /users/me` run the body through
      `express-xss-sanitizer`, which strips HTML tags (and their content) before
      validation.
    * **JSON body limit** — request bodies are limited to 100 kB by `express.json()`.

    ---

    ## CORS

    Only the following origins are allowed:

    * `http://localhost:5173`
    * `http://10.0.0.102:5173`
    * `https://mini-community.frizzera.dev`
    * `https://mini-community-ednan.vercel.app`

    Allowed methods are `GET`, `POST`, `PATCH` and `DELETE`. Preflight requests
    (`OPTIONS`) are answered with `200` and an `Access-Control-Allow-Methods` header
    listing those four verbs. Requests coming from a non-allowed origin are still
    executed — they simply do not receive the `Access-Control-Allow-Origin` header, so
    the browser blocks the response.

    ---

    ## Security headers

    Every response is hardened with `helmet` and includes
    `Content-Security-Policy`, `Cross-Origin-Opener-Policy: same-origin`,
    `Cross-Origin-Resource-Policy: same-origin`, `Origin-Agent-Cluster: ?1`,
    `Referrer-Policy: no-referrer`, `Strict-Transport-Security: max-age=31536000; includeSubDomains`,
    `X-Content-Type-Options: nosniff`, `X-DNS-Prefetch-Control: off`,
    `X-Download-Options: noopen`, `X-Frame-Options: SAMEORIGIN` and
    `X-Permitted-Cross-Domain-Policies: none`.

    ---

    ## Error catalogue

    | Status | Raised when                                                              |
    | ------ | ------------------------------------------------------------------------- |
    | `400`  | Malformed ObjectId, failed Zod validation, empty update payload, self-follow / self-unfollow |
    | `401`  | Missing, malformed, expired or tampered JWT (`UnauthorizedError`) or a user that no longer exists (`UnauthenticatedError`) |
    | `404`  | Resource does not exist, caller is not the author of the resource, or the route does not exist |
    | `429`  | Rate limit exceeded (shape differs from the standard envelope)             |
    | `500`  | Any unhandled error (Mongoose `CastError` / `ValidationError`, duplicate key, …) |

    ### Known quirks

    These are real behaviours of the current implementation and are reflected in the
    response definitions below.

    1. **Duplicate e-mail / nickname → `500`.** The unique indexes on `email` and
       `nickname` make MongoDB raise `E11000`. The error handler only recognises that
       shape when the error exposes `cause.code === 11000`, which Mongoose 8 does not
       provide, so the dedicated `409 Conflict` branch is currently unreachable and the
       raw MongoDB message is returned with a `500` status.
    2. **`GET /users/{id}/following` answers with a `followers` key.** The list of users
       that the target user follows is returned under the property name `followers`.
    3. **`POST /auth/register` discards `avatarUrl` and `bio`.** Both properties pass
       validation but are not persisted — only `nickname`, `email` and `password` are
       stored. Use `PATCH /users/me` to set them afterwards.
    4. **`PATCH /users/me` silently ignores `password`.** The field passes Zod
       validation but is filtered out before the update, so a request whose only
       property is `password` fails with `No valid update data provided.`
    5. **Optional properties are omitted, not null.** Mongoose leaves unset paths
       `undefined`, and `JSON.stringify` drops them — a user without a bio has no `bio`
       key at all in the response.
    6. **An invalid `cursor` produces a `500`.** Cursors are converted with
       `new mongoose.Types.ObjectId(cursor)`, which throws for malformed input.
    7. **The top-level `/api/v1/comments` mount is a duplicate.** `GET /api/v1/comments`
       can never return anything (there is no `postId` to filter on) and
       `POST /api/v1/comments` always answers `404`. Use the nested
       `/api/v1/posts/{postId}/comments` routes instead.
    8. **`GET /api/v1/users/me` fails with a `500`.** Only `PATCH /users/me` and
       `DELETE /users/me` exist; a `GET` on that path is matched by the
       `GET /users/{id}` route with `id = "me"`, which is not a valid ObjectId, so the
       request ends in a Mongoose `CastError` (`500`). Use `GET /api/v1/auth/me` to read
       your own profile.
