servers:
  - url: http://localhost:9000/api/v1
    description: Local development server (PORT=9000 in backend/.env)
  - url: http://10.0.0.102:9000/api/v1
    description: LAN development server used by the Vite dev frontend
  - url: https://mini-community-9aza.onrender.com/api/v1
    description: Production server (Render free tier — the first request after an idle period may take a while while the instance wakes up)

tags:
  - name: Authentication
    description: Registration, login, logout and current-session inspection.
  - name: Users
    description: Profile retrieval and management, plus the follow / unfollow graph.
  - name: Posts
    description: Global feed, personalised feed, post authoring and deletion.
  - name: Comments
    description: Comments belonging to a post (nested under `/posts/{postId}/comments`).
  - name: Comments (Top-Level Mount)
    description: |
      The comments router is mounted a second time at `/api/v1/comments` in `app.ts`.
      These routes duplicate the nested ones but behave differently because the
      `postId` route parameter is missing. They are documented for completeness —
      prefer the nested routes under `/posts/{postId}/comments`.

externalDocs:
  description: Project repository and backend source
  url: https://github.com/ednanf/mini-community

paths:
  # ==========================================================================
  # AUTHENTICATION
  # ==========================================================================
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: |
        Creates a new user account and immediately returns a signed JWT so the caller
        can start using the API without logging in.

        **Validation (Zod)**

        | Field      | Rules                                                        |
        | ---------- | ------------------------------------------------------------ |
        | `nickname` | required, 3–10 characters                                    |
        | `email`    | required, valid e-mail address                              |
        | `password` | required, at least 6 characters                              |
        | `avatarUrl`| optional, at most 2048 characters                            |
        | `bio`      | optional, at most 280 characters                             |

        The body is XSS-sanitised before validation and unknown properties are stripped.

        **Storage rules (Mongoose)**

        * `nickname` and `email` are trimmed and lower-cased, so `Alice` is stored as
          `alice` and the uniqueness indexes are case-insensitive.
        * `nickname` must be 3–30 characters and `email` at least 5 characters in the
          database; the Zod limits above are stricter and therefore always win.
        * `password` is hashed with bcrypt (10 salt rounds) before being stored and is
          never returned by any endpoint.
        * `avatarUrl` must be a valid URL (≤ 2048 characters) and `bio` ≤ 280 characters
          when present in the database.

        **Note:** `avatarUrl` and `bio` are accepted and validated but are **not
        persisted** by this endpoint — only `nickname`, `email` and `password` are
        written to the database. Call `PATCH /api/v1/users/me` to set them later.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
            example:
              nickname: johndoe
              email: john.doe@example.com
              password: securePassword123
              avatarUrl: https://example.com/avatars/johndoe.jpg
              bio: Software developer passionate about open source
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegisterResponse'
              example:
                status: success
                data:
                  message: User registered successfully.
                  id: 6ad63ae4f5663c55f5529b4b
                  nickname: johndoe
                  email: john.doe@example.com
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2YWQ2M2FlNGY1NjYzYzU1ZjU1MjljNGIiLCJpYXQiOjE3OTI0MjQ2NDEsImV4cCI6MTc5NTAxNjY0MX0.hUHbrlyiSsuVr7xr8Zj5e6O_RFAQVvc2EXRvDK6pAM8
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Log in to an existing account
      description: |
        Authenticates a user with e-mail and password and returns a fresh JWT.

        The response is deliberately identical whether the account does not exist or the
        password is wrong (`There is an issue with your email or password`), so the
        endpoint cannot be used to enumerate registered accounts.

        **Validation (Zod)** — `email` must be a valid e-mail address and `password` must
        be at least 6 characters. A shorter password is rejected with `400` *before* the
        credentials are checked, so a `400` here does not imply that the account exists.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
            example:
              email: john.doe@example.com
              password: securePassword123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginResponse'
              example:
                status: success
                data:
                  message: Log in successful. Welcome back!
                  id: 6ad63ae4f5663c55f5529b4b
                  nickname: johndoe
                  email: john.doe@example.com
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2YWQ2M2FlNGY1NjYzYzU1ZjU1MjljNGIiLCJpYXQiOjE3OTI0MjQ2NDEsImV4cCI6MTc5NTAxNjY0MX0.hUHbrlyiSsuVr7xr8Zj5e6O_RFAQVvc2EXRvDK6pAM8
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out of the application
      description: |
        Acknowledges a logout request. **No authentication is required and the token is
        not invalidated** — JWTs are stateless, so the client is responsible for deleting
        the token from its storage. The endpoint exists so the client has a single,
        consistent place to confirm the operation.
      operationId: logoutUser
      responses:
        '200':
          description: Logout acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLogoutResponse'
              example:
                status: success
                data:
                  message: Good bye!
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get the authenticated user's own profile
      description: |
        Returns the profile of the user that owns the supplied token.

        The payload is resolved from the database on every call, so it always reflects
        the current state of the account. `bio` and `avatarUrl` are only present when the
        user has actually set them.
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMeResponse'
              example:
                status: success
                data:
                  message: User retrieved successfuly
                  id: 6ad63ae4f5663c55f5529b4b
                  nickname: johndoe
                  bio: Software developer passionate about open source
                  avatarUrl: https://example.com/avatars/johndoe.jpg
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================================================
  # USERS
  # ==========================================================================
  /users/me:
    patch:
      tags:
        - Users
      summary: Update the authenticated user's profile
      description: |
        Partially updates the profile of the authenticated user. Every property is
        optional, but **at least one updatable property must be present** — otherwise the
        request fails with `No valid update data provided.`

        **Updatable properties**

        | Field       | Rules                                                    |
        | ----------- | -------------------------------------------------------- |
        | `nickname`  | 3–10 characters, lower-cased on save, must stay unique   |
        | `email`     | valid e-mail address, must stay unique                   |
        | `bio`       | at most 280 characters                                   |
        | `avatarUrl` | at most 2048 characters and a syntactically valid URL    |

        `password` is accepted by the request schema but is **not** part of the update
        allow-list, so it is silently discarded. A body containing only `password`
        therefore produces `400 No valid update data provided.`

        The body is XSS-sanitised, validated with Zod and stripped of unknown
        properties. The Mongoose validators run again on write (`runValidators`), so an
        `avatarUrl` that is not a valid URL fails the request with a `500`
        (`Validation failed: avatarUrl: Validator failed for path 'avatarUrl' ...`).
      operationId: updateCurrentUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatchRequest'
            example:
              nickname: johndoe2
              bio: Updated bio with new information
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPatchResponse'
              example:
                status: success
                data:
                  message: User updated successfully.
                  nickname: johndoe2
                  email: john.doe@example.com
                  bio: Updated bio with new information
                  avatarUrl: https://example.com/avatars/johndoe.jpg
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The e-mail or nickname is already taken by another account.

            **Currently unreachable** — see the *Known quirks* section in the API
            description: duplicate keys surface as `500` because the error handler does
            not recognise Mongoose 8's error shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MongoDuplicateKeyResponse'
              example:
                status: error
                data:
                  code: 11000
                  message: Email already exists.
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Users
      summary: Delete the authenticated user's account
      description: |
        Permanently removes the authenticated user and every piece of data attached to
        them. The following operations run concurrently:

        * all posts authored by the user are deleted;
        * all comments authored by the user are deleted;
        * the user is removed from the `followers` list of everybody they followed;
        * the user is removed from the `following` list of everybody who followed them;
        * the user document itself is deleted.

        **This operation cannot be undone.**
      operationId: deleteCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDeleteResponse'
              example:
                status: success
                data:
                  message: User deleted successfully.
                  email: john.doe@example.com
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get a user profile by id
      description: |
        Returns the public profile of a single user together with the follower/following
        counters.

        Authentication is **optional**: when a valid token is supplied, `isFollowing`
        reports whether the caller follows that user; for anonymous callers it is always
        `false`. An invalid token is ignored and the request is served anonymously.

        `bio` and `avatarUrl` are only present when the user has set them.

        **Note:** this route is *not* protected by the ObjectId validation middleware.
        A malformed `id` produces a `500` (Mongoose `CastError`) rather than a `400`.
        For the same reason `GET /api/v1/users/me` also fails with a `500` — there is no
        `GET /users/me` route, so the request is handled as `GET /users/{id}` with
        `id = "me"`. Use `GET /api/v1/auth/me` to read your own profile.
      operationId: getUserById
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGetByIdResponse'
              example:
                status: success
                data:
                  message: User fetched successfully.
                  id: 6ad63ae4f5663c55f5529b4b
                  nickname: johndoe
                  email: john.doe@example.com
                  bio: Software developer passionate about open source
                  avatarUrl: https://example.com/avatars/johndoe.jpg
                  followersCount: 42
                  followingCount: 17
                  isFollowing: true
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}/followers:
    get:
      tags:
        - Users
      summary: List the followers of a user
      description: |
        Returns the users that follow the target user. Each entry exposes only the public
        part of the profile: `id`, `email`, and — when set — `bio` and `avatarUrl`.
        The nickname is not part of the payload.

        Authentication is **required**.

        **Note:** this route is *not* protected by the ObjectId validation middleware, so a
        malformed `id` produces a `500` instead of a `400`.
      operationId: getUserFollowers
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Followers retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFollowersResponse'
              example:
                status: success
                data:
                  message: User's followers fetched successfully.
                  followers:
                    - id: 6ad63ae4f5663c55f5529b4b
                      email: john.doe@example.com
                      bio: Software developer passionate about open source
                      avatarUrl: https://example.com/avatars/johndoe.jpg
                    - id: 6ad63ae4f5663c55f5529c0d
                      email: jane.doe@example.com
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}/following:
    get:
      tags:
        - Users
      summary: List the users a user is following
      description: |
        Returns the users that the target user follows. Each entry exposes only the
        public part of the profile: `id`, `email`, and — when set — `bio` and `avatarUrl`.

        Authentication is **required**.

        **Quirk:** although this endpoint returns the *following* list, the property is
        named **`followers`** in the response body. This is the current server behaviour
        and is reproduced faithfully in this specification.

        **Note:** this route is *not* protected by the ObjectId validation middleware, so a
        malformed `id` produces a `500` instead of a `400`.
      operationId: getUserFollowing
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Following list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFollowingResponse'
              example:
                status: success
                data:
                  message: User's following list fetched successfully.
                  followers:
                    - id: 6ad63ae4f5663c55f5529c0d
                      email: jane.doe@example.com
                      bio: Designer
                      avatarUrl: https://example.com/avatars/jane.jpg
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}/is-following:
    get:
      tags:
        - Users
      summary: Check whether the caller follows a user
      description: |
        Returns a single boolean telling whether the authenticated user currently follows
        the target user. It is always `false` when the caller queries their own profile,
        because following yourself is rejected.

        Authentication is **required**.

        **Note:** this route is *not* protected by the ObjectId validation middleware, so a
        malformed `id` produces a `500` instead of a `400`.
      operationId: isFollowingUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Follow state retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserIsFollowingResponse'
              example:
                status: success
                data:
                  message: Successfully checked if user is following another user.
                  isFollowing: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/follow/{id}:
    post:
      tags:
        - Users
      summary: Follow a user
      description: |
        Makes the authenticated user follow the target user. The follower's `following`
        array and the followee's `followers` array are updated concurrently.

        The operation is **idempotent**: it uses `$addToSet`, so following the same user
        twice leaves a single entry in both arrays and still returns `200`.

        Following yourself is rejected with `400`.

        **Note:** this route is *not* protected by the ObjectId validation middleware, so a
        malformed `id` produces a `500` (Mongoose `CastError`) instead of a `400`.
      operationId: followUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: User followed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFollowResponse'
              example:
                status: success
                data:
                  message: User followed successfully.
                  followedUser: 6ad63ae4f5663c55f5529c0d
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/unfollow/{id}:
    post:
      tags:
        - Users
      summary: Unfollow a user
      description: |
        Removes the target user from the caller's `following` array and removes the
        caller from the target's `followers` array. Both updates run concurrently.

        The operation is **idempotent**: unfollowing a user that is not followed simply
        returns `200`.

        Unfollowing yourself is rejected with `400`.

        **Note:** this route is *not* protected by the ObjectId validation middleware, so a
        malformed `id` produces a `500` (Mongoose `CastError`) instead of a `400`.
      operationId: unfollowUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: User unfollowed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUnfollowResponse'
              example:
                status: success
                data:
                  message: User unfollowed successfully.
                  unfollowedUser: 6ad63ae4f5663c55f5529c0d
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================================================
  # POSTS
  # ==========================================================================
  /posts:
    get:
      tags:
        - Posts
      summary: Get the global feed
      description: |
        Returns every post of the community, newest first. **No authentication is
        required.**

        The list is paginated with the `limit` / `cursor` pair; see the
        *Cursor pagination* section of the API description.
      operationId: getPosts
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Posts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostsListResponse'
              example:
                status: success
                data:
                  message: Posts retrieved successfully
                  posts:
                    - _id: 6ad63ae4f5663c55f5529b55
                      createdBy:
                        _id: 6ad63ae4f5663c55f5529b4b
                        nickname: johndoe
                      postContent: Just built an amazing API with Node.js and Express!
                      postComments: []
                      createdAt: '2026-10-19T15:44:36.554Z'
                      updatedAt: '2026-10-19T15:44:36.554Z'
                      __v: 0
                  nextCursor: 6ad63ae4f5663c55f5529b55
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Posts
      summary: Create a post
      description: |
        Publishes a new post authored by the authenticated user.

        **Validation** — `postContent` is required, must not be empty and must be at most
        140 characters long. The body is XSS-sanitised and unknown properties are
        stripped before validation.

        The response contains the freshly created post. Note that `createdBy` is returned
        as a raw ObjectId string here (it is not populated with the author profile), and
        that `postComments` is an empty array because the post has no comments yet.
      operationId: createPost
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreateRequest'
            example:
              postContent: Just built an amazing API with Node.js and Express!
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostCreateResponse'
              example:
                status: success
                data:
                  message: Post created successfully
                  postContent:
                    createdBy: 6ad63ae4f5663c55f5529b4b
                    postContent: Just built an amazing API with Node.js and Express!
                    postComments: []
                    _id: 6ad63ae4f5663c55f5529b55
                    createdAt: '2026-10-19T15:44:36.554Z'
                    updatedAt: '2026-10-19T15:44:36.554Z'
                    __v: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /posts/my-posts:
    get:
      tags:
        - Posts
      summary: Get the authenticated user's own posts
      description: |
        Returns only the posts written by the authenticated user, newest first.
        Authentication is **required**.

        The list is paginated with the `limit` / `cursor` pair.
      operationId: getMyPosts
      security:
        - BearerAuth: []
      parameters:
